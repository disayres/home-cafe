<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>home-cafe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-background">
    <div id="app">
      <!-- header section -->
      <header id="header" class="text-white mt-4">
        <!-- desktop header -->
        <div
          class="w-330 max-w-full h-17 mx-auto py-3 px-5 bg-primary rounded-xl"
        >
          <div class="container flex justify-between items-center mx-auto">
            <!-- desktop header right (logo and menu) -->
            <div class="flex gap-6 items-center">
              <div class="flex items-center justify-center">
                <a href="#">
                  <img
                    class="w-24"
                    src="/src/assets/images/app-logo.png"
                    alt="home cafe logo"
                  />
                </a>
              </div>
              <ul class="flex gap-4">
                <li class="group hover:text-secondary transition-colors">
                  <a href="#" class="flex gap-1 items-center py-3 px-4">
                    <svg class="size-5.5">
                      <use href="/svg/icons.svg#sort"></use>
                    </svg>
                    دسته‌بندی محصولات
                    <svg
                      class="size-4 transition-transform duration-200 group-hover:rotate-180"
                    >
                      <use href="/svg/icons.svg#chevron-down"></use>
                    </svg>
                  </a>
                </li>
                <li class="hover:text-secondary transition-colors">
                  <a href="#" class="flex gap-1 items-center py-3 px-4">
                    <svg class="size-5.5">
                      <use href="/svg/icons.svg#about-icon"></use>
                    </svg>
                    درباره ما
                  </a>
                </li>
                <li class="hover:text-secondary transition-colors">
                  <a href="#" class="flex gap-1 items-center py-3 px-4">
                    <svg class="size-5.5">
                      <use href="/svg/icons.svg#phone-icon"></use>
                    </svg>
                    تماس با ما
                  </a>
                </li>
                <li class="group hover:text-secondary transition-colors">
                  <a href="#" class="flex gap-1 items-center py-3 px-4">
                    <svg class="size-5.5">
                      <use href="/svg/icons.svg#pages-icon"></use>
                    </svg>
                    سایر صفحات
                    <svg
                      class="size-4 transition-transform duration-200 group-hover:rotate-180"
                    >
                      <use href="/svg/icons.svg#chevron-down"></use>
                    </svg>
                  </a>
                </li>
              </ul>
            </div>
            <!-- desktop header left (basket,profile) -->
            <div class="flex gap-x-4">
              <!-- basket -->
              <div class="group relative persian-number font-bold">
                <a href="#" class="header__btn">
                  <span class="btn__comp">
                    <span>0</span>
                    <svg class="size-4">
                      <use href="/svg/icons.svg#toman-icon"></use>
                    </svg>
                  </span>
                  <svg class="size-5">
                    <use href="/svg/icons.svg#basket-icon"></use>
                  </svg>
                </a>

                <!-- basket hover -->
                <div
                  class="p-3 w-55 shadow-xl rounded-3xl bg-white text-text text-xs font-bold font-morabba absolute top-15 end-0 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-[opacity,visibility] delay-150"
                >
                  <span>سبد خرید شما خالی است!</span>
                </div>
              </div>

              <!-- line -->
              <svg class="w-px h-11">
                <use href="/svg/icons.svg#divider-icon"></use>
              </svg>

              <!-- profile -->
              <div class="font-morabba">
                <a href="#" class="header__btn">
                  <span class="btn__comp">
                    <span class="text-nowrap text-xs">ورود | ثبت نام</span>
                  </span>

                  <svg class="size-5">
                    <use href="/svg/icons.svg#user-icon"></use>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
