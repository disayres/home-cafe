<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>home-cafe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-secondary">
    <div id="app">
      <!-- header section -->
      <header id="header" class="text-white mt-4">
        <!-- desktop header -->
        <div
          class="w-330 max-w-full h-17 mx-auto py-3 px-5 bg-primary rounded-xl"
        >
          <div class="container flex justify-between items-center mx-auto">
            <!-- desktop header right (logo and menu) -->
            <div class="flex gap-6 items-center">
              <div class="flex items-center justify-center">
                <img
                  class="w-32"
                  src="src/assets/images/logo.png"
                  alt="home cafe logo"
                />
              </div>
              <ul
                class="flex gap-4 *:flex *:gap-1 *:items-center *:py-3 *:px-4 *:cursor-pointer"
              >
                <li class="hover:text-secondary">
                  <svg class="size-5.5">
                    <use href="/svg/icons.svg#sort"></use>
                  </svg>
                  <a href="#"> دسته‌بندی محصولات</a>
                  <svg class="size-4">
                    <use href="/svg/icons.svg#chevron-down"></use>
                  </svg>
                </li>
                <li>
                  <svg class="size-5.5">
                    <use href="/svg/icons.svg#about-icon"></use>
                  </svg>
                  <a href="#">درباره ما</a>
                </li>
                <li>
                  <svg class="size-5.5">
                    <use href="/svg/icons.svg#phone-icon"></use>
                  </svg>
                  <a href="#">تماس با ما </a>
                </li>
                <li>
                  <svg class="size-5.5">
                    <use href="/svg/icons.svg#pages-icon"></use>
                  </svg>
                  <a href="#">سایر صفحات</a>
                  <svg class="size-4">
                    <use href="/svg/icons.svg#chevron-down"></use>
                  </svg>
                </li>
              </ul>
            </div>
            <!-- desktop header left (basket,profile) -->
            <div class="flex gap-x-4">
              <div
                class="w-31 h-11 persian-number bg-[#5886a2] flex items-center justify-between gap-x-2 rounded-4xl p-1 pl-2.5 font-bold cursor-pointer"
              >
                <div
                  class="flex items-center justify-between w-20 h-full px-2 gap-x-1 bg-white text-primary rounded-4xl"
                >
                  <span>0</span>
                  <svg class="size-4">
                    <use href="/svg/icons.svg#toman-icon"></use>
                  </svg>
                </div>
                <svg class="size-5">
                  <use href="/svg/icons.svg#basket-icon"></use>
                </svg>
              </div>
              <svg class="w-px h-11">
                <use href="/svg/icons.svg#divider-icon"></use>
              </svg>

              <div
                class="w-31 h-11 bg-[#5886a2] flex items-center justify-between gap-x-2 rounded-4xl p-1 pl-2.5 font-morabba cursor-pointer"
              >
                <div
                  class="flex w-20 items-center justify-between h-full px-2 bg-white text-primary rounded-4xl"
                >
                  <span class="text-nowrap text-xs">ورود | ثبت نام</span>
                </div>

                <svg class="size-5">
                  <use href="/svg/icons.svg#user-icon"></use>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
